name: "Labels: Size"
on:
  # /// WL Change: use pull_request_target so GITHUB_TOKEN can apply labels on PRs.
  pull_request_target:
    types: [opened, synchronize, reopened]
jobs:
  size-label:
    permissions:
      contents: read
      # /// WL Change: required for /issues/{n}/labels endpoint used by size-label-action.
      issues: write
      # /// WL Change: required to mutate pull request metadata from workflow.
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: size-label
        uses: "pascalgn/size-label-action@v0.5.5"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          # Custom size configuration
          sizes: >
            {
              "0": "XS",
              "10": "S",
              "100": "M",
              "1000": "L",
              "5000": "XL"
            }
