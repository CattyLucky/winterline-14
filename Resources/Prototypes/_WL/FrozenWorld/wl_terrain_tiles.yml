- type: entity
  name: Wood Planking
  parent: FloorTileItemBase
  id: WLSnowFoundationTileItem
  description: A foundation plate for building on frozen terrain.
  components:
  - type: Sprite
    state: wood-large
  - type: Item
    heldPrefix: wood
  - type: FloorTile
    outputs:
    - WLPlatingSnowFoundation
  - type: Stack
    stackType: WLSnowFoundationTile

