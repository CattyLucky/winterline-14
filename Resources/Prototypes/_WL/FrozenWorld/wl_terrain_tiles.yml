- type: tile
  id: WLFloorSnow
  parent: FloorSnow
  name: tiles-wl-snow
  deconstructTools: []
  indestructible: true
  weather: true
  mobAcceleration: 1
  mobFriction: 1
  wlTerrainTags:
  - Snow
  - DeepSnow

- type: tile
  id: WLFloorSnowDug
  parent: FloorSnowDug
  name: tiles-wl-snow-dug
  deconstructTools: []
  indestructible: true
  weather: true
  mobAcceleration: 1
  mobFriction: 1
  wlTerrainTags:
  - Snow
  - PackedSnow

- type: tile
  id: WLPlatingSnowFoundation
  parent: PlatingSnow
  name: tiles-wl-snow-foundation
  deconstructTools: [ Prying ]
  indestructible: false
  baseTurf: WLFloorSnow
  baseWhitelist:
  - WLFloorSnow
  - WLFloorSnowDug
  itemDrop: WLSnowFoundationTileItem
  weather: true
  mobAcceleration: 1
  mobFriction: 1
  wlTerrainTags:
  - Foundation
  - PackedSnow

- type: tile
  id: WLFloorSteel
  parent: FloorSteel
  name: tiles-wl-steel-floor
  baseTurf: WLPlatingSnowFoundation
  baseWhitelist:
  - WLPlatingSnowFoundation
  mobAcceleration: 1
  mobFriction: 1
  wlTerrainTags:
  - Constructed
  - Road

- type: frozenSurface
  id: WLFloorSnow
  speedModifier: 0.50
  footContactPenaltyCelsius: 6

- type: frozenSurface
  id: WLFloorSnowDug
  speedModifier: 0.75
  footContactPenaltyCelsius: 10

- type: frozenSurface
  id: WLPlatingSnowFoundation
  speedModifier: 0.75
  footContactPenaltyCelsius: 0

- type: stack
  id: WLSnowFoundationTile
  name: wl-snow-foundation-tile
  icon: { sprite: Objects/Tiles/tile.rsi, state: wood-large }
  spawn: WLSnowFoundationTileItem

- type: entity
  name: Wood Planking
  parent: FloorTileItemBase
  id: WLSnowFoundationTileItem
  description: A foundation plate for building on frozen terrain.
  components:
  - type: Sprite
    state: wood-large
  - type: Item
    heldPrefix: wood
  - type: FloorTile
    outputs:
    - WLPlatingSnowFoundation
  - type: Stack
    stackType: WLSnowFoundationTile
