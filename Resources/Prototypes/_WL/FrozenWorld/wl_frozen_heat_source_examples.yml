# Real spawnable frozen-world heat source entities.

- type: entity
  id: WLCampfireHeatSource
  parent: Fireplace
  name: frozen campfire
  description: A reliable heat source for survival in the frozen wastes.
  components:
  - type: Sprite
    sprite: _WL/FrozenWorld/HeatSources/wl_campfire.rsi
    layers:
    - state: off
      map: [ "fuel_state" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FrozenHeatSourceFuelVisuals.Burning:
        fuel_state:
          True: { state: on }
          False: { state: off }
  - type: FrozenHeatSource
    enabled: false
    dynamic: false
    innerRadius: 1.5
    outerRadius: 4
    heatBonus: 45
    transferEfficiency: 1
  - type: Storage
    openOnActivate: false
    showVerb: false
    grid:
    - 0,0,2,1
    maxItemSize: Normal
    whitelist:
      components:
      - FrozenFuel
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.FrozenWorldUiKey.HeatSourceFuel:
        type: FrozenHeatSourceFuelBoundUserInterface
  - type: ActivatableUI
    key: enum.FrozenWorldUiKey.HeatSourceFuel
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: FrozenHeatSourceFuel
    fuelContainerId: storagebase
    requiresIgnition: true
    canIgniteWithItem: true
    allowUiIgnition: false
    burnRate: 1
    autoConsumeFuel: true

- type: entity
  id: WLGeneratorHeatSource
  parent: GeneratorBasic
  name: frozen heat generator
  description: A generator tuned to radiate strong local heat in extreme cold.
  components:
  - type: Sprite
    sprite: _WL/FrozenWorld/HeatSources/wl_generator_heater.rsi
    snapCardinals: true
    layers:
    - state: off
      map: [ "fuel_state" ]
    - state: on_glow
      map: [ "fuel_glow" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FrozenHeatSourceFuelVisuals.Burning:
        fuel_state:
          True: { state: on }
          False: { state: off }
        fuel_glow:
          True: { visible: true }
          False: { visible: false }
  - type: PointLight
    radius: 3
    energy: 2
    color: "#FF8A3D"
    castShadows: false
  - type: FrozenHeatSource
    enabled: false
    dynamic: false
    innerRadius: 4
    outerRadius: 10
    heatBonus: 55
    transferEfficiency: 1
  - type: Storage
    openOnActivate: false
    showVerb: false
    grid:
    - 0,0,3,2
    maxItemSize: Normal
    whitelist:
      components:
      - FrozenFuel
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.FrozenWorldUiKey.HeatSourceFuel:
        type: FrozenHeatSourceFuelBoundUserInterface
  - type: ActivatableUI
    key: enum.FrozenWorldUiKey.HeatSourceFuel
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: FrozenHeatSourceFuel
    fuelContainerId: storagebase
    requiresIgnition: true
    canIgniteWithItem: true
    allowUiIgnition: true
    burnRate: 1
    autoConsumeFuel: true

