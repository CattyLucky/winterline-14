# /// WL Change
# Square-zone preset for the Frostpunk/RimWorld-like survival map.
# Distances are measured from the edge of the base AABB, not from the map center.
- type: frozenWorldZonePreset
  id: FrostRimDefaultZones
  zones:
  - id: SpawnField
    minDistance: 8
    maxDistance: 35
    ambientTemperatureOffset: 0
    spawnAttempts: 50
    spawns:
    - prototype: WLFrozenBranchPileDebug
      weight: 3
      minCount: 2
      maxCount: 4
      minSeparation: 10
      clearanceRadius: 1.0
    - prototype: WLLooseScrapPileDebug
      weight: 2
      minCount: 1
      maxCount: 3
      minSeparation: 10
      clearanceRadius: 1.0
    - prototype: WLTornSupplyBagDebug
      weight: 1
      minCount: 1
      maxCount: 2
      minSeparation: 10
      clearanceRadius: 1.0

  - id: NearField
    minDistance: 40
    maxDistance: 100
    ambientTemperatureOffset: -4
    spawnAttempts: 60
    spawns:
    - prototype: WLSmallCoalOutcropDebug
      weight: 3
      minCount: 3
      maxCount: 5
      minSeparation: 16
      clearanceRadius: 1.5
    - prototype: WLFrozenDeadwoodClusterDebug
      weight: 2
      minCount: 2
      maxCount: 4
      minSeparation: 16
      clearanceRadius: 1.5
    - prototype: WLSmallScrapPileDebug
      weight: 1
      minCount: 1
      maxCount: 3
      minSeparation: 16
      clearanceRadius: 1.5

  - id: WorkField
    minDistance: 100
    maxDistance: 180
    ambientTemperatureOffset: -9
    spawnAttempts: 80
    spawns:
    - prototype: WLCoalOutcropDebug
      weight: 3
      minCount: 3
      maxCount: 5
      minSeparation: 24
      clearanceRadius: 2.0
    - prototype: WLScrapWreckDebug
      weight: 2
      minCount: 2
      maxCount: 4
      minSeparation: 24
      clearanceRadius: 2.0
    - prototype: WLFrozenGroveDebug
      weight: 2
      minCount: 2
      maxCount: 4
      minSeparation: 24
      clearanceRadius: 2.0

  - id: ExpeditionField
    minDistance: 180
    maxDistance: 300
    ambientTemperatureOffset: -15
    spawnAttempts: 100
    spawns:
    - prototype: WLLargeCoalVeinDebug
      weight: 3
      minCount: 2
      maxCount: 4
      minSeparation: 40
      clearanceRadius: 2.5
    - prototype: WLFrozenConvoyWreckDebug
      weight: 2
      minCount: 2
      maxCount: 3
      minSeparation: 40
      clearanceRadius: 2.5
    - prototype: WLOldSupplyCacheDebug
      weight: 1
      minCount: 1
      maxCount: 2
      minSeparation: 40
      clearanceRadius: 2.5
