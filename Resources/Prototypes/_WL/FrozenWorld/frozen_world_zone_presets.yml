# /// WL Change
# Square-zone preset for the Frostpunk/RimWorld-like survival map.
# Distances are measured from the edge of the base AABB, not from the map center.
- type: frozenWorldZonePreset
  id: FrostRimDefaultZones
  zones:
  - id: SpawnField
    minDistance: 8
    maxDistance: 35
    ambientTemperatureOffset: 0
    spawnAttempts: 50
    spawns:
    - prototype: WLResourceFrozenBranchPileT1
      weight: 3
      minCount: 2
      maxCount: 4
      minSeparation: 10
      clearanceRadius: 1.0
    - prototype: WLResourceLooseScrapPileT1
      weight: 2
      minCount: 1
      maxCount: 3
      minSeparation: 10
      clearanceRadius: 1.0
    - prototype: WLResourceTornSupplyBagT1
      weight: 1
      minCount: 1
      maxCount: 2
      minSeparation: 10
      clearanceRadius: 1.0

  - id: NearField
    minDistance: 40
    maxDistance: 100
    ambientTemperatureOffset: -4
    spawnAttempts: 60
    spawns:
    - prototype: WLResourceCharcoalPitT2
      weight: 3
      minCount: 3
      maxCount: 5
      minSeparation: 16
      clearanceRadius: 1.5
    - prototype: WLResourceFrozenDeadwoodT2
      weight: 2
      minCount: 2
      maxCount: 4
      minSeparation: 16
      clearanceRadius: 1.5
    - prototype: WLResourceSmallScrapPileT2
      weight: 1
      minCount: 1
      maxCount: 3
      minSeparation: 16
      clearanceRadius: 1.5

  - id: WorkField
    minDistance: 100
    maxDistance: 180
    ambientTemperatureOffset: -9
    spawnAttempts: 80
    poiAttempts: 6
    pois:
    - poi: WLMeatballMagnetPoi
      weight: 1
      minCount: 2
      maxCount: 3
      minSeparation: 56
    spawns:
    - prototype: WLResourceCoalOutcropT3
      weight: 3
      minCount: 3
      maxCount: 5
      minSeparation: 24
      clearanceRadius: 2.0
    - prototype: WLResourceScrapWreckT3
      weight: 2
      minCount: 2
      maxCount: 4
      minSeparation: 24
      clearanceRadius: 2.0
    - prototype: WLResourceFrozenGroveT3
      weight: 2
      minCount: 2
      maxCount: 4
      minSeparation: 24
      clearanceRadius: 2.0

  - id: ExpeditionField
    minDistance: 180
    maxDistance: 300
    ambientTemperatureOffset: -15
    spawnAttempts: 100
    poiAttempts: 8
    pois:
    - poi: WLMeatballMagnetPoi
      weight: 1
      minCount: 2
      maxCount: 3
      minSeparation: 64
    - poi: WLVeganMeatballMagnetPoi
      weight: 2
      minCount: 2
      maxCount: 3
      minSeparation: 64
    spawns:
    - prototype: WLResourceLargeCoalVeinT4
      weight: 3
      minCount: 2
      maxCount: 4
      minSeparation: 40
      clearanceRadius: 2.5
    - prototype: WLResourceFrozenConvoyWreckT4
      weight: 2
      minCount: 2
      maxCount: 3
      minSeparation: 40
      clearanceRadius: 2.5
    - prototype: WLResourceOldSupplyCacheT4
      weight: 1
      minCount: 1
      maxCount: 2
      minSeparation: 40
      clearanceRadius: 2.5
    - prototype: WLResourceDeepCoalSeamT5
      weight: 1
      minCount: 1
      maxCount: 2
      minSeparation: 48
      clearanceRadius: 2.5
    - prototype: WLResourceIndustrialRuinT5
      weight: 1
      minCount: 1
      maxCount: 2
      minSeparation: 48
      clearanceRadius: 2.5
    - prototype: WLResourceSealedExpeditionCacheT5
      weight: 1
      minCount: 1
      maxCount: 1
      minSeparation: 48
      clearanceRadius: 2.5

