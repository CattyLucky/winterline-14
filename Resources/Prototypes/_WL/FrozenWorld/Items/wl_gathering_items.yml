# /// WL Change
# Предметы добычи для FrozenWorld — выпадают из ResourcePoint при сборе.
# Стартовые ресурсы: ветки, металлолом, ткань.

- type: entity
  id: WLFrozenBranch
  parent: BaseItem
  name: frozen branch
  description: A dead branch coated in ice. Needs to thaw before it burns well, but it's wood nonetheless.
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    state: wood
  - type: Item
    size: Small
  - type: Stack
    stackType: WLFrozenBranchStack
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Wood: 100
  - type: FrozenFuel
    fuelSeconds: 40
    priority: 10
    heatBonusMultiplier: 0.9
    transferEfficiencyMultiplier: 0.9
    burnRateMultiplier: 1.25

- type: entity
  id: WLLooseScrap
  parent: BaseItem
  name: loose scrap
  description: A bent chunk of scrap metal salvaged from the ruins. Useful for crude tools and repairs.
  components:
  - type: Sprite
    sprite: Objects/Materials/Sheets/metal.rsi
    state: steel
    color: "#8a8a7a"
  - type: Item
    size: Small
  - type: Stack
    stackType: WLLooseScrapStack
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  id: WLTornCloth
  parent: BaseItem
  name: torn cloth
  description: A strip of weathered fabric. Not much on its own, but cloth is cloth out here.
  components:
  - type: Sprite
    sprite: Objects/Materials/materials.rsi
    state: cloth
  - type: Item
    size: Small
  - type: Stack
    stackType: WLTornClothStack
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: FrozenFuel
    fuelSeconds: 12
    priority: 0
    heatBonusMultiplier: 0.7
    transferEfficiencyMultiplier: 0.8
    burnRateMultiplier: 1.5
