# /// WL Change
# FrozenWorld raw gathering materials.
#
# Keep these simple and broad: recipes consume the stack types below, while
# higher-tier resource points control yield and access through their loot tables.

# --- Tier 1: Raw Survival Materials -----------------------------------------

- type: entity
  id: WLFrozenBranch
  parent: BaseItem
  name: frozen branch
  description: A dead branch glazed with ice. It burns poorly until dried, but it is still wood.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: firewood_3
    layers:
    - state: firewood_3
      map: ["base"]
  - type: Appearance
  - type: Item
    size: Small
  - type: Stack
    stackType: WLFrozenBranchStack
    baseLayer: base
    layerStates:
    - firewood
    - firewood_2
    - firewood_3
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Wood: 100
  - type: FrozenFuel
    fuelSeconds: 35
    priority: 10
    heatBonusMultiplier: 0.85
    transferEfficiencyMultiplier: 0.9
    burnRateMultiplier: 1.35

- type: entity
  id: WLFrozenBranch30
  parent: WLFrozenBranch
  suffix: 30
  components:
  - type: Sprite
    state: firewood_3
  - type: Stack
    count: 30

- type: entity
  id: WLScrapMetal
  parent: BaseItem
  name: scrap metal
  description: Bent metal scraps salvaged from frozen ruins. Useful for crude tools, repairs and early shelter work.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_steel_3
    layers:
    - state: scrap_steel_3
      map: ["base"]
  - type: Appearance
  - type: Item
    size: Small
  - type: Stack
    stackType: WLScrapMetalStack
    baseLayer: base
    layerStates:
    - scrap_steel
    - scrap_steel_2
    - scrap_steel_3
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  id: WLScrapMetal30
  parent: WLScrapMetal
  suffix: 30
  components:
  - type: Sprite
    state: scrap_steel_3
  - type: Stack
    count: 30

- type: entity
  id: WLLooseScrap
  parent: WLScrapMetal
  categories: [ HideSpawnMenu ]

- type: entity
  id: WLLooseScrap30
  parent: WLScrapMetal30
  categories: [ HideSpawnMenu ]

- type: entity
  id: WLRoughStone
  parent: BaseItem
  name: rough stone
  description: Broken stone from frozen ground and old masonry. Useful for heavy floors, fireplaces, and rugged outdoor paving.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_3
    color: "#77716a"
    layers:
    - state: scrap_3
      map: ["base"]
  - type: Appearance
  - type: Item
    size: Small
  - type: Stack
    stackType: WLRoughStoneStack
    baseLayer: base
    layerStates:
    - scrap
    - scrap_2
    - scrap_3
    count: 1

- type: entity
  id: WLRoughStone30
  parent: WLRoughStone
  suffix: 30
  components:
  - type: Sprite
    state: scrap_3
  - type: Stack
    count: 30

- type: entity
  id: WLTornCloth
  parent: BaseItem
  name: torn cloth
  description: A weathered strip of fabric. Weak as gear, useful as padding, wrapping or desperate tinder.
  components:
  - type: Sprite
    sprite: _WL/Objects/Materials/rags.rsi
    state: rags-1
    layers:
    - state: rags-1
      map: ["base"]
  - type: Appearance
  - type: Item
    size: Small
  - type: Stack
    stackType: WLTornClothStack
    baseLayer: base
    layerStates:
    - rags-1
    - rags-2
    - rags-3
    layerFunction: Threshold
    count: 1
  - type: StackLayerThreshold
    thresholds: [10, 20]
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: FrozenFuel
    fuelSeconds: 10
    priority: 0
    heatBonusMultiplier: 0.65
    transferEfficiencyMultiplier: 0.8
    burnRateMultiplier: 1.75

- type: entity
  id: WLTornCloth30
  parent: WLTornCloth
  suffix: 30
  components:
  - type: Sprite
    state: rags-3
  - type: Stack
    count: 30

