# /// WL Change
# FrozenWorld raw gathering materials.
#
# Keep these simple and broad: recipes consume the stack types below, while
# higher-tier resource points control yield and access through their loot tables.

# --- Tier 1: Raw Survival Materials -----------------------------------------

- type: entity
  id: WLFrozenBranch
  parent: BaseItem
  name: frozen branch
  description: A dead branch glazed with ice. It burns poorly until dried, but it is still wood.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_wood
  - type: Item
    size: Small
  - type: Stack
    stackType: WLFrozenBranchStack
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Wood: 100
  - type: FrozenFuel
    fuelSeconds: 35
    priority: 10
    heatBonusMultiplier: 0.85
    transferEfficiencyMultiplier: 0.9
    burnRateMultiplier: 1.35

- type: entity
  id: WLFrozenBranch30
  parent: WLFrozenBranch
  suffix: 30
  components:
  - type: Stack
    count: 30

- type: entity
  id: WLLooseScrap
  parent: BaseItem
  name: loose scrap
  description: Bent metal scraps salvaged from frozen ruins. Useful for crude tools, repairs and shelter work.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_steel
  - type: Item
    size: Small
  - type: Stack
    stackType: WLLooseScrapStack
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  id: WLLooseScrap30
  parent: WLLooseScrap
  suffix: 30
  components:
  - type: Stack
    count: 30

- type: entity
  id: WLRoughStone
  parent: BaseItem
  name: rough stone
  description: Broken stone from frozen ground and old masonry. Useful for heavy floors, fireplaces, and rugged outdoor paving.
  components:
  - type: Sprite
    sprite: Objects/Materials/ore.rsi
    state: iron
    color: "#77716a"
  - type: Item
    size: Small
  - type: Stack
    stackType: WLRoughStoneStack
    count: 1

- type: entity
  id: WLRoughStone30
  parent: WLRoughStone
  suffix: 30
  components:
  - type: Stack
    count: 30

- type: entity
  id: WLTornCloth
  parent: BaseItem
  name: torn cloth
  description: A weathered strip of fabric. Weak as gear, useful as padding, wrapping or desperate tinder.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: cloth
  - type: Item
    size: Small
  - type: Stack
    stackType: WLTornClothStack
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: FrozenFuel
    fuelSeconds: 10
    priority: 0
    heatBonusMultiplier: 0.65
    transferEfficiencyMultiplier: 0.8
    burnRateMultiplier: 1.75

- type: entity
  id: WLTornCloth30
  parent: WLTornCloth
  suffix: 30
  components:
  - type: Stack
    count: 30

