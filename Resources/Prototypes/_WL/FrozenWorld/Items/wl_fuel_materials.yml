# /// WL Change
# FrozenWorld fuel materials by quality tier.
#
# Fuel is consumed by FrozenHeatSourceFuel one stack unit at a time. Higher
# priority burns first, so better fuel naturally takes over when mixed.

# --- Tier 2: Prepared Wood ---------------------------------------------------

- type: entity
  id: WLMaterialWoodFuel
  parent: MaterialWoodPlank
  name: frozen firewood
  description: Split timber prepared for shelter heating. Better than raw branches and easy to store.
  suffix: Full
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: firewood_3
    layers:
    - state: firewood_3
      map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: WLWoodFuelStack
    baseLayer: base
    layerStates:
    - firewood
    - firewood_2
    - firewood_3
  - type: FrozenFuel
    fuelSeconds: 70
    priority: 20
    heatBonusMultiplier: 1.0
    transferEfficiencyMultiplier: 1.0
    burnRateMultiplier: 1.0

- type: entity
  id: WLMaterialWoodFuel10
  parent: WLMaterialWoodFuel
  suffix: 10
  components:
  - type: Sprite
    state: firewood_2
  - type: Stack
    count: 10

- type: entity
  id: WLMaterialWoodFuel1
  parent: WLMaterialWoodFuel
  suffix: Single
  components:
  - type: Sprite
    state: firewood
  - type: Stack
    count: 1

- type: entity
  id: WLLog
  parent: Log
  name: frozen log
  description: A heavy frozen trunk. Saw or split it into boards before serious construction.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: log
  - type: ToolRefinable
    qualityNeeded: Sawing
    refineResult:
    - id: WLWoodPlank1
      amount: 4

# --- Tier 3: Charcoal --------------------------------------------------------

- type: entity
  id: WLCharcoalFuel
  parent: Coal
  name: frost-dry charcoal
  description: Dry charcoal pulled from old burn pits. It catches better than coal and burns longer than wood.
  suffix: Full
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: coal_3
    layers:
    - state: coal_3
      map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: WLCharcoalFuelStack
    baseLayer: base
    layerStates:
    - coal
    - coal_2
    - coal_3
  - type: FrozenFuel
    fuelSeconds: 100
    priority: 30
    heatBonusMultiplier: 1.1
    transferEfficiencyMultiplier: 1.05
    burnRateMultiplier: 0.95

- type: entity
  id: WLCharcoalFuel10
  parent: WLCharcoalFuel
