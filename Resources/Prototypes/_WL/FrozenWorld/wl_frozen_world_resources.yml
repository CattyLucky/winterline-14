  - type: Sprite
    sprite: Structures/Storage/orebox.rsi
    state: orebox
    color: "#1a1a1a"
  - type: WLResourcePoint
    charges: 4
    gatherTime: 5.0
    loot:
    - prototype: WLCoalFuel1
      minCount: 2
      maxCount: 4

- type: entity
  id: WLScrapWreckDebug
  parent: BaseStructure
  name: scrap wreck
  suffix: WL, Debug
  description: The remains of something large and mechanical. A rich source of metal and parts.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Storage/closet.rsi
    state: metalbox
    color: "#666666"

- type: entity
  id: WLFrozenGroveDebug
  parent: BaseStructure
  name: frozen grove
  suffix: WL, Debug
  description: A cluster of ancient frozen trees. Enough wood here to keep fires burning for weeks.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Decoration/bonfire.rsi
    state: bonfire_extinguished
    color: "#6b5a3e"
  - type: WLResourcePoint
    charges: 4
    gatherTime: 5.0
    loot:
    - prototype: WLMaterialWoodFuel1
