# /// WL Change
# FrozenWorld world resource points by tier.
#
# Distance/zone controls live in frozen_world_zone_presets.yml. These entities
# only describe what the player sees, how long gathering takes and what drops.

- type: entity
  id: WLBaseResourcePoint
  parent: BaseStructure
  abstract: true
  categories: [ HideSpawnMenu ]

# --- Tier 1: Spawn Field -----------------------------------------------------

- type: entity
  id: WLResourceFrozenBranchPileT1
  parent: WLBaseResourcePoint
  name: frozen branch pile
  suffix: WL, Resource, T1
  description: Dead branches frozen into the snow. Crude fuel and basic building material for the first hours.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_wood
  - type: WLResourcePoint
    charges: 3
    maxCharges: 3
    gatherTime: 2.5
    loot:
    - prototype: WLFrozenBranch
      minCount: 2
      maxCount: 4

- type: entity
  id: WLResourceLooseScrapPileT1
  parent: WLBaseResourcePoint
  name: loose scrap pile
  suffix: WL, Resource, T1
  description: A small spill of metal scraps half-buried in ice. Barely enough to start building.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_steel
  - type: WLResourcePoint
    charges: 2
    maxCharges: 2
    gatherTime: 2.8
    loot:
    - prototype: WLLooseScrap
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceTornSupplyBagT1
  parent: WLBaseResourcePoint
  name: torn supply bag
  suffix: WL, Resource, T1
  description: A ripped emergency bag with a little cloth and salvage still inside.
  components:
  - type: Sprite
    sprite: _WL/Objects/Materials/Scrap/generic.rsi
    state: clothing_uniform_trash2
  - type: WLResourcePoint
    charges: 1
    maxCharges: 1
    gatherTime: 2.0
    loot:
    - prototype: WLTornCloth
      minCount: 2
      maxCount: 4
    - prototype: WLLooseScrap
      minCount: 1
      maxCount: 2

# --- Tier 2: Near Field ------------------------------------------------------

- type: entity
  id: WLResourceFrozenDeadwoodT2
  parent: WLBaseResourcePoint
  name: frozen deadwood cluster
  suffix: WL, Resource, T2
  description: Dead wood locked in ice. It takes work to break loose, but it yields logs for boards and fuel.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: log
  - type: WLResourcePoint
    charges: 3
    maxCharges: 3
    gatherTime: 3.8
    loot:
    - prototype: WLLog
      minCount: 1
      maxCount: 2
    - prototype: WLFrozenBranch
      minCount: 1
      maxCount: 2

- type: entity
  id: WLResourceCharcoalPitT2
  parent: WLBaseResourcePoint
  name: buried charcoal pit
  suffix: WL, Resource, T2
  description: A frozen old firepit with dry charcoal preserved under the snow.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: coal
  - type: WLResourcePoint
    charges: 2
    maxCharges: 2
    gatherTime: 4.0
    loot:
    - prototype: WLCharcoalFuel1
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceSmallScrapPileT2
  parent: WLBaseResourcePoint
  name: small scrap pile
  suffix: WL, Resource, T2
  description: Twisted metal and torn lining from a buried machine shell.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_2
  - type: WLResourcePoint
    charges: 3
    maxCharges: 3
    gatherTime: 3.8
    loot:
    - prototype: WLLooseScrap
      minCount: 2
      maxCount: 4
    - prototype: WLTornCloth
      minCount: 1
      maxCount: 2

# --- Tier 3: Work Field ------------------------------------------------------

- type: entity
  id: WLResourceCoalOutcropT3
  parent: WLBaseResourcePoint
  name: coal outcrop
  suffix: WL, Resource, T3
  description: A solid coal deposit breaking through the frozen ground. The first dependable industrial fuel.
  components:
  - type: Sprite
    sprite: Objects/Materials/ore.rsi
    state: coal
  - type: WLResourcePoint
    charges: 4
    maxCharges: 4
    gatherTime: 4.8
    loot:
    - prototype: WLCoalFuel1
      minCount: 2
      maxCount: 4

- type: entity
  id: WLResourceScrapWreckT3
  parent: WLBaseResourcePoint
  name: scrap wreck
  suffix: WL, Resource, T3
  description: The remains of something large and mechanical. A richer source of metal and usable parts.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: scrap_3
  - type: WLResourcePoint
    charges: 4
    maxCharges: 4
    gatherTime: 4.8
    loot:
    - prototype: WLLooseScrap
      minCount: 3
      maxCount: 5
    - prototype: WLTornCloth
      minCount: 1
      maxCount: 2

- type: entity
  id: WLResourceFrozenGroveT3
  parent: WLBaseResourcePoint
  name: frozen grove
  suffix: WL, Resource, T3
  description: A cluster of ancient frozen trees. Enough timber here to cut boards for regular shelter work.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: log
  - type: WLResourcePoint
    charges: 4
    maxCharges: 4
    gatherTime: 5.0
    loot:
    - prototype: WLLog
      minCount: 2
      maxCount: 4
    - prototype: WLFrozenBranch
      minCount: 2
      maxCount: 3

# --- Tier 4: Expedition Field ------------------------------------------------

- type: entity
  id: WLResourceLargeCoalVeinT4
  parent: WLBaseResourcePoint
  name: large coal vein
  suffix: WL, Resource, T4
  description: A heavy exposed coal vein far from shelter. It can feed the settlement through long cold pushes.
  components:
  - type: Sprite
    sprite: Objects/Materials/ore.rsi
    state: coal
    color: "#cfcfe0"
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 5.8
    loot:
    - prototype: WLCoalFuel1
      minCount: 3
      maxCount: 5
    - prototype: WLDenseCoalFuel1
      minCount: 1
      maxCount: 2

- type: entity
  id: WLResourceFrozenConvoyWreckT4
  parent: WLBaseResourcePoint
  name: frozen convoy wreck
  suffix: WL, Resource, T4
  description: A supply convoy locked under snow. Heavy salvage, fabric and fuel remain in the wreckage.
  components:
  - type: Sprite
    sprite: _WL/Objects/Materials/Scrap/generic.rsi
    state: balka_trash
  - type: WLResourcePoint
    charges: 4
    maxCharges: 4
    gatherTime: 5.6
    loot:
    - prototype: WLLooseScrap
      minCount: 4
      maxCount: 7
    - prototype: WLTornCloth
      minCount: 2
      maxCount: 4
    - prototype: WLCoalFuel1
      minCount: 1
      maxCount: 2

- type: entity
  id: WLResourceOldSupplyCacheT4
  parent: WLBaseResourcePoint
  name: old supply cache
  suffix: WL, Resource, T4
  description: A sealed pre-collapse cache. The contents are worn, but still valuable.
  components:
  - type: Sprite
    sprite: _WL/Objects/Materials/Scrap/securedbox.rsi
    state: icon
  - type: WLResourcePoint
    charges: 3
    maxCharges: 3
    gatherTime: 5.2
    loot:
    - prototype: WLTornCloth
      minCount: 3
      maxCount: 5
    - prototype: WLLooseScrap
      minCount: 2
      maxCount: 4
    - prototype: WLLog
      minCount: 1
      maxCount: 2

# --- Tier 5: Deep Expedition Finds ------------------------------------------

- type: entity
  id: WLResourceDeepCoalSeamT5
  parent: WLBaseResourcePoint
  name: deep coal seam
  suffix: WL, Resource, T5
  description: Dense black coal exposed in a dangerous distant seam. Premium fuel for late settlement heat.
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/materials.rsi
    state: coal
    color: "#b8c2ff"
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 6.5
    loot:
    - prototype: WLDenseCoalFuel1
      minCount: 3
      maxCount: 5
    - prototype: WLCoalFuel1
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceIndustrialRuinT5
  parent: WLBaseResourcePoint
  name: frozen industrial ruin
  suffix: WL, Resource, T5
  description: A collapsed industrial shell. Valuable metal, heavy insulation and dense fuel can be recovered here.
  components:
  - type: Sprite
    sprite: _WL/Objects/Materials/Scrap/generic.rsi
    state: hv_cabel_trash
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 6.2
    loot:
    - prototype: WLLooseScrap
      minCount: 6
      maxCount: 9
    - prototype: WLTornCloth
      minCount: 2
      maxCount: 4
    - prototype: WLDenseCoalFuel1
      minCount: 1
      maxCount: 2

- type: entity
  id: WLResourceSealedExpeditionCacheT5
  parent: WLBaseResourcePoint
  name: sealed expedition cache
  suffix: WL, Resource, T5
  description: A distant cache from a failed expedition. Rarely intact, always worth the risk.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/generic.rsi
    state: closed
    color: "#b9c7d8"
  - type: WLResourcePoint
    charges: 3
    maxCharges: 3
    gatherTime: 6.0
    loot:
    - prototype: WLTornCloth
      minCount: 5
      maxCount: 8
    - prototype: WLLooseScrap
      minCount: 4
      maxCount: 6
    - prototype: WLDenseCoalFuel1
      minCount: 1
      maxCount: 1
