# /// WL Change
# FrozenWorld world resource points by tier.
#
# Zone spawn counts: frozen_world_zone_presets.yml
# Round timeline: Balance/wl_survival_balance.yml
# World sprites for nodes (stacks in hand keep wl_frozen_stacks icons).
# Gather time, charges, and loot only.

- type: entity
  id: WLBaseResourcePoint
  parent: BaseStructure
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Overdoors

# --- Tier 1: Spawn Field -----------------------------------------------------

- type: entity
  id: WLResourceFrozenBranchPileT1
  parent: WLBaseResourcePoint
  name: frozen branch pile
  suffix: WL, Resource, T1
  description: Dead branches frozen into the snow. Crude fuel and basic building material for the first hours.
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_treessnow.rsi
    state: treestump
    offset: 0,0.35
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 2.2
    loot:
    - prototype: WLFrozenBranch
      minCount: 3
      maxCount: 5

- type: entity
  id: WLResourceLooseScrapPileT1
  parent: WLBaseResourcePoint
  name: scrap metal spill
  suffix: WL, Resource, T1
  description: A small spill of scrap metal half-buried in ice. Barely enough to start building.
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_rockssolid.rsi
    state: rocksolid02
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 2.4
    loot:
    - prototype: WLScrapMetal
      minCount: 3
      maxCount: 5

- type: entity
  id: WLResourceTornSupplyBagT1
  parent: WLBaseResourcePoint
  name: torn supply bag
  suffix: WL, Resource, T1
  description: A ripped emergency bag with a little cloth and salvage still inside.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/plastic.rsi
    state: icon
  - type: WLResourcePoint
    charges: 3
    maxCharges: 3
    gatherTime: 2.0
    loot:
    - prototype: WLTornCloth
      minCount: 3
      maxCount: 5
    - prototype: WLScrapMetal
      minCount: 2
      maxCount: 3

# --- Tier 2: Near Field ------------------------------------------------------

- type: entity
  id: WLResourceFrozenDeadwoodT2
  parent: WLBaseResourcePoint
  name: frozen deadwood cluster
  suffix: WL, Resource, T2
  description: Dead wood locked in ice. It takes work to break loose, but it yields logs for boards and fuel.
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_treessnow.rsi
    state: treesnow02
    offset: 0,0.7
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 3.4
    loot:
    - prototype: WLLog
      minCount: 2
      maxCount: 3
    - prototype: WLFrozenBranch
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceCharcoalPitT2
  parent: WLBaseResourcePoint
  name: buried charcoal pit
  suffix: WL, Resource, T2
  description: A frozen old firepit with dry charcoal preserved under the snow.
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_stalagmite.rsi
    state: grey_stalagmite3
  - type: WLResourcePoint
    charges: 4
    maxCharges: 4
    gatherTime: 3.6
    loot:
    - prototype: WLCharcoalFuel1
      minCount: 3
      maxCount: 5

- type: entity
  id: WLResourceSmallScrapPileT2
  parent: WLBaseResourcePoint
  name: small scrap pile
  suffix: WL, Resource, T2
  description: Twisted metal and torn lining from a buried machine shell.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: ironrock
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 3.5
    loot:
    - prototype: WLScrapMetal
      minCount: 3
      maxCount: 5
    - prototype: WLTornCloth
      minCount: 2
      maxCount: 3

# --- Tier 3: Work Field ------------------------------------------------------

- type: entity
  id: WLResourceCoalOutcropT3
  parent: WLBaseResourcePoint
  name: coal outcrop
  suffix: WL, Resource, T3
  description: A solid coal deposit breaking through the frozen ground. The first dependable industrial fuel.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_coal
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 4.4
    loot:
    - prototype: WLCoalFuel1
      minCount: 3
      maxCount: 5

- type: entity
  id: WLResourceIronOreVeinT3
  parent: WLBaseResourcePoint
  name: iron ore vein
  suffix: WL, Resource, T3, Ore
  description: A frozen iron-bearing vein exposed through cracked stone. It needs a pickaxe and a smelter before it becomes useful metal.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
    color: "#8e9094"
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 4.8
    toolWhitelist:
      tags:
      - Pickaxe
    loot:
    - prototype: WLIronOre1
      minCount: 3
      maxCount: 5

- type: entity
  id: WLResourceScrapWreckT3
  parent: WLBaseResourcePoint
  name: scrap wreck
  suffix: WL, Resource, T3
  description: The remains of something large and mechanical. A richer source of metal and usable parts.
  components:
  - type: Sprite
    sprite: _WL/Objects/Materials/Scrap/generic.rsi
    state: balka_trash
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 4.4
    loot:
    - prototype: WLScrapMetal
      minCount: 4
      maxCount: 7
    - prototype: WLTornCloth
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceFrozenGroveT3
  parent: WLBaseResourcePoint
  name: frozen grove
  suffix: WL, Resource, T3
  description: A cluster of ancient frozen trees. Enough timber here to cut boards for regular shelter work.
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_treessnow.rsi
    state: treesnow04
    offset: 0,0.7
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 4.6
    loot:
    - prototype: WLLog
      minCount: 3
      maxCount: 5
    - prototype: WLFrozenBranch
      minCount: 3
      maxCount: 4

# --- Tier 4: Expedition Field ------------------------------------------------

- type: entity
  id: WLResourceLargeCoalVeinT4
  parent: WLBaseResourcePoint
  name: large coal vein
  suffix: WL, Resource, T4
  description: A heavy exposed coal vein far from shelter. It can feed the settlement through long cold pushes.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_coal
    color: "#b8c4d8"
  - type: WLResourcePoint
    charges: 7
    maxCharges: 7
    gatherTime: 5.4
    loot:
    - prototype: WLCoalFuel1
      minCount: 4
      maxCount: 6
    - prototype: WLDenseCoalFuel1
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceLeadOreVeinT4
  parent: WLBaseResourcePoint
  name: lead ore vein
  suffix: WL, Resource, T4, Ore
  description: A dark lead-rich vein in the outer ruins. It is not a starter material; it feeds ammunition and heavy fittings after smelting.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
    color: "#606876"
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 5.2
    toolWhitelist:
      tags:
      - Pickaxe
    loot:
    - prototype: WLLeadOre1
      minCount: 2
      maxCount: 4

- type: entity
  id: WLResourceFrozenConvoyWreckT4
  parent: WLBaseResourcePoint
  name: frozen convoy wreck
  suffix: WL, Resource, T4
  description: A supply convoy locked under snow. Heavy salvage, fabric and fuel remain in the wreckage.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/generic.rsi
    state: closed
    color: "#8a9aaa"
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 5.2
    loot:
    - prototype: WLScrapMetal
      minCount: 5
      maxCount: 8
    - prototype: WLTornCloth
      minCount: 3
      maxCount: 5
    - prototype: WLCoalFuel1
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceOldSupplyCacheT4
  parent: WLBaseResourcePoint
  name: old supply cache
  suffix: WL, Resource, T4
  description: A sealed pre-collapse cache. The contents are worn, but still valuable.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/freezer.rsi
    state: icon
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 4.8
    loot:
    - prototype: WLTornCloth
      minCount: 4
      maxCount: 6
    - prototype: WLScrapMetal
      minCount: 3
      maxCount: 5
    - prototype: WLLog
      minCount: 2
      maxCount: 3

# --- Tier 5: Deep Expedition Finds ------------------------------------------

- type: entity
  id: WLResourceDeepCoalSeamT5
  parent: WLBaseResourcePoint
  name: deep coal seam
  suffix: WL, Resource, T5
  description: Dense black coal exposed in a dangerous distant seam. Premium fuel for late settlement heat.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_coal
    color: "#9aa8e8"
  - type: WLResourcePoint
    charges: 8
    maxCharges: 8
    gatherTime: 6.0
    loot:
    - prototype: WLDenseCoalFuel1
      minCount: 4
      maxCount: 6
    - prototype: WLCoalFuel1
      minCount: 3
      maxCount: 5

- type: entity
  id: WLResourceIndustrialRuinT5
  parent: WLBaseResourcePoint
  name: frozen industrial ruin
  suffix: WL, Resource, T5
  description: A collapsed industrial shell. Valuable metal, heavy insulation and dense fuel can be recovered here.
  components:
  - type: Sprite
    sprite: Structures/Machines/ore_processor.rsi
    state: icon
  - type: WLResourcePoint
    charges: 7
    maxCharges: 7
    gatherTime: 5.8
    loot:
    - prototype: WLScrapMetal
      minCount: 7
      maxCount: 10
    - prototype: WLTornCloth
      minCount: 3
      maxCount: 5
    - prototype: WLDenseCoalFuel1
      minCount: 2
      maxCount: 3

- type: entity
  id: WLResourceSealedExpeditionCacheT5
  parent: WLBaseResourcePoint
  name: sealed expedition cache
  suffix: WL, Resource, T5
  description: A distant cache from a failed expedition. Rarely intact, always worth the risk.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/generic.rsi
    state: closed
    color: "#b9c7d8"
  - type: WLResourcePoint
    charges: 5
    maxCharges: 5
    gatherTime: 5.4
    loot:
    - prototype: WLTornCloth
      minCount: 6
      maxCount: 9
    - prototype: WLScrapMetal
      minCount: 5
      maxCount: 8
    - prototype: WLDenseCoalFuel1
      minCount: 1
      maxCount: 2

# --- Stone (pickaxe) — tiered with zones --------------------------------------

- type: entity
  id: WLRoughStonePileT2
  parent: WLBaseResourcePoint
  name: rough stone pile
  suffix: WL, Resource, T2, Stone
  description: Broken frozen masonry and loose stone. Heavy, but useful for proper floors.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_snow
  - type: WLResourcePoint
    charges: 4
    maxCharges: 4
    gatherTime: 3.2
    toolWhitelist:
      tags:
      - Pickaxe
    loot:
    - prototype: WLRoughStone
      minCount: 3
      maxCount: 5

- type: entity
  id: WLResourceFrozenRubbleOutcropT3
  parent: WLBaseResourcePoint
  name: frozen rubble outcrop
  suffix: WL, Resource, T3, Stone
  description: A compact pile of cracked stone locked into the ice. Good material for floors and heat-safe masonry.
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
    color: "#7a746c"
  - type: WLResourcePoint
    charges: 6
    maxCharges: 6
    gatherTime: 4.6
    toolWhitelist:
      tags:
      - Pickaxe
    loot:
    - prototype: WLRoughStone
      minCount: 4
      maxCount: 7

- type: entity
  id: WLResourceOldMasonryRuinT4
  parent: WLBaseResourcePoint
  name: old masonry ruin
  suffix: WL, Resource, T4, Stone
  description: A collapsed stone ruin buried under frost. Slow to break apart, but rich in heavy building material.
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_rockssolid.rsi
    state: rocksolid03
  - type: WLResourcePoint
    charges: 7
    maxCharges: 7
    gatherTime: 5.4
    toolWhitelist:
      tags:
      - Pickaxe
    loot:
    - prototype: WLRoughStone
      minCount: 5
      maxCount: 8
    - prototype: WLScrapMetal
      minCount: 2
      maxCount: 3
