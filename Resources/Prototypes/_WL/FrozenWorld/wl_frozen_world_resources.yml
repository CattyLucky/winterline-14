      maxCount: 5

# ─── ExpeditionField — дальние ценные объекты ─────────────────────────────────

- type: entity
  id: WLLargeCoalVeinDebug
  parent: BaseStructure
  name: large coal vein
  suffix: WL, Debug
  description: A massive exposed coal seam. Enough to fuel the settlement for a long time — if you can reach it.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Storage/orebox.rsi
    state: orebox
    color: "#111111"
  - type: WLResourcePoint
    charges: 5
    gatherTime: 6.0
    loot:
    - prototype: WLCoalFuel1
      minCount: 3
      maxCount: 5

- type: entity
  id: WLFrozenConvoyWreckDebug
  parent: BaseStructure
  name: frozen convoy wreck
  suffix: WL, Debug
  description: The frozen remains of a supply convoy. Valuable salvage, but far from home.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Storage/closet.rsi
    state: metalbox
    color: "#4a4a4a"

- type: entity
  id: WLOldSupplyCacheDebug
  parent: BaseStructure
  name: old supply cache
  suffix: WL, Debug
  description: A pre-collapse supply cache buried under ice and snow. What's left inside?
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/generic.rsi
    state: closed
