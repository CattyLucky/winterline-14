        !type:DamageTrigger
        damage: 240
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          WLWoodPlank1:
            min: 1
            max: 2
          WLPreparedCloth1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: wlwoodinsulated
    base: wood
  - type: FrozenShelterBoundary
    insulation: 0.93
  - type: FrozenShelterDeconstructible
    doAfter: 4
    refunds:
    - proto: WLWoodPlank1
      count: 3
    - proto: WLPreparedCloth1
