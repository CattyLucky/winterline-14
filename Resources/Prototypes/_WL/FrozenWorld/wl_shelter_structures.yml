- type: entity
  id: WLPrimitiveWoodWall
  parent: BaseWall
  name: primitive wood wall
  description: A rough insulated wall for the first frozen shelters.
  components:
  - type: Sprite
    sprite: Structures/Walls/wood.rsi
  - type: Icon
    sprite: Structures/Walls/wood.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 220
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
    - trigger:
        !type:DamageTrigger
        damage: 90
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          WLFrozenBranch:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: woods
    base: wood
  - type: FrozenShelterBoundary
    insulation: 0.70
  - type: FrozenShelterDeconstructible
    doAfter: 3
    refunds:
    - proto: WLFrozenBranch
      count: 2

- type: entity
  id: WLPrimitiveWoodDoor
  parent: BaseMaterialDoorNavMap
  name: primitive wood door
  description: A crude door that closes a shelter but leaks heat when left open.
  components:
  - type: Sprite
    sprite: Structures/Doors/MineralDoors/wood_door.rsi
  - type: Door
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 140
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 55
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          WLFrozenBranch:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FrozenShelterBoundary
    insulation: 0.65
    leakWhenOpen: true
  - type: FrozenShelterDeconstructible
    doAfter: 3
    refunds:
    - proto: WLFrozenBranch
      count: 3
    - proto: WLTornCloth
      count: 1

