- type: frozenWeatherVisual
  id: WLWeatherVisualClear
  profile: Clear
  fadeInSeconds: 2
  fadeOutSeconds: 2

- type: frozenWeatherVisual
  id: WLWeatherVisualLightSnow
  profile: LightSnow
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_light
  ambientSound:
    path: /Audio/Effects/Weather/snowstorm_weak.ogg
    params:
      volume: -14
  fadeInSeconds: 2
  fadeOutSeconds: 2

- type: frozenWeatherVisual
  id: WLWeatherVisualSnow
  profile: Snow
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_med
  ambientSound:
    path: /Audio/Effects/Weather/snowstorm_weak.ogg
    params:
      volume: -12
  fadeInSeconds: 2
  fadeOutSeconds: 2

- type: frozenWeatherVisual
  id: WLWeatherVisualBlizzard
  profile: Blizzard
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_heavy
  ambientSound:
    path: /Audio/Effects/Weather/snowstorm.ogg
    params:
      volume: -9
  fadeInSeconds: 2
  fadeOutSeconds: 2

- type: frozenWeatherVisual
  id: WLWeatherVisualHeavySnow
  profile: HeavySnow
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_heavy
  ambientSound:
    path: /Audio/Effects/Weather/snowstorm_weak.ogg
    params:
      volume: -10
  fadeInSeconds: 2
  fadeOutSeconds: 2

- type: frozenWeatherVisual
  id: WLWeatherVisualWhiteout
  profile: Whiteout
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_heavy
  ambientSound:
    path: /Audio/Effects/Weather/snowstorm.ogg
    params:
      volume: -7
  fadeInSeconds: 2
  fadeOutSeconds: 2

- type: frozenWeather
  id: WLClear
  displayName: Clear
  temperatureOffset: 0
  exposureGainMultiplier: 1
  recoveryMultiplier: 1
  coldDamageMultiplier: 1
  shelterPenetration: 0
  visual: WLWeatherVisualClear

- type: frozenWeather
  id: WLLightSnow
  displayName: Light snow
  temperatureOffset: -4
  exposureGainMultiplier: 1.05
  recoveryMultiplier: 0.95
  coldDamageMultiplier: 1
  shelterPenetration: 0.01
  visual: WLWeatherVisualLightSnow

- type: frozenWeather
  id: WLSnow
  displayName: Snow
  temperatureOffset: -8
  exposureGainMultiplier: 1.15
  recoveryMultiplier: 0.90
  coldDamageMultiplier: 1.05
  shelterPenetration: 0.03
  visual: WLWeatherVisualSnow

- type: frozenWeather
  id: WLHeavySnow
  displayName: Heavy snow
  temperatureOffset: -12
  exposureGainMultiplier: 1.35
  recoveryMultiplier: 0.80
  coldDamageMultiplier: 1.10
  shelterPenetration: 0.06
  visual: WLWeatherVisualHeavySnow

- type: frozenWeather
  id: WLBlizzard
  displayName: Blizzard
  temperatureOffset: -18
  exposureGainMultiplier: 1.65
  recoveryMultiplier: 0.65
  coldDamageMultiplier: 1.25
  shelterPenetration: 0.10
  visual: WLWeatherVisualBlizzard

- type: frozenWeather
  id: WLWhiteout
  displayName: Whiteout
  temperatureOffset: -24
  exposureGainMultiplier: 2.00
  recoveryMultiplier: 0.45
  coldDamageMultiplier: 1.50
  shelterPenetration: 0.16
  visual: WLWeatherVisualWhiteout

- type: wlWeatherCyclePreset
  id: WLFrostRimDefaultWeatherCycle
  stepDelay: 8m
  cycle:
  - WLClear
  - WLLightSnow
  - WLSnow
  - WLLightSnow
  - WLClear
  - WLSnow
  - WLHeavySnow
  - WLSnow
  - WLBlizzard
  - WLHeavySnow
  - WLBlizzard
  - WLWhiteout
  stepDelays:
  - 10m
  - 8m
  - 8m
  - 6m
  - 8m
  - 8m
  - 7m
  - 6m
  - 6m
  - 5m
  - 5m
  - 4m
  startIndex: 0
  applyOnMapInit: true
