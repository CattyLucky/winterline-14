- type: entity
  parent: StatusEffectBase
  id: WLWeatherBase
  abstract: true
  components:
  - type: WeatherStatusEffect
  - type: FrozenWeatherModifier
  - type: StatusEffect
    whitelist:
      components:
      - Map

- type: entity
  parent: WLWeatherBase
  id: WLWeatherHail
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/Effects/weather.rsi
      state: hail
    sound:
      path: /Audio/Effects/Weather/rain.ogg
      params:
        loop: true
        volume: -6
  - type: FrozenWeatherModifier
    displayName: Hail
    temperatureOffset: -12
    exposureGainMultiplier: 1.2
    recoveryMultiplier: 0.85
    coldDamageMultiplier: 1.1
    blockedByRoof: true

- type: entity
  parent: WLWeatherBase
  id: WLWeatherSnowfallLight
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/Effects/weather.rsi
      state: snowfall_light
    sound:
      path: /Audio/Effects/Weather/snowstorm_weak.ogg
      params:
        loop: true
        volume: -6
  - type: FrozenWeatherModifier
    displayName: Light snow
    temperatureOffset: -20
    exposureGainMultiplier: 1.05
    recoveryMultiplier: 0.95
    coldDamageMultiplier: 1
    blockedByRoof: true

