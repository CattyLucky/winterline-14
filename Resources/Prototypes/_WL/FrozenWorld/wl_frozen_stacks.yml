# WL-specific stack types for frozen-world resources.
# Keeps balancing isolated from vanilla stack definitions.
#
# Final material pipeline:
# - Raw: logs, scrap metal, iron ore, lead ore, rough stone, torn cloth, snow.
# - Processed: rough planks, iron ingots, lead ingots, stone blocks, prepared cloth.
# - Fuel: firewood, charcoal, coal, dense coal.
# - Wildlife: hide and fat; meat/bones stay on vanilla prototypes.

# --- Raw Craft Materials -----------------------------------------------------

- type: stack
  parent: BaseMediumStack
  id: WLScrapMetalStack
  name: stack-wl-scrap-metal
  icon: { sprite: /Textures/_WL/Objects/Misc/materials.rsi, state: scrap_steel_3 }
  spawn: WLScrapMetal

- type: stack
  parent: BaseMediumStack
  id: WLLooseScrapStack
  name: stack-wl-scrap-metal
  icon: { sprite: /Textures/_WL/Objects/Misc/materials.rsi, state: scrap_steel_3 }
