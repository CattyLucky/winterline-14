# WL-specific stack types for frozen-world resources.
# Keeps balancing isolated from vanilla stack definitions.

# --- Raw Craft Materials -----------------------------------------------------

- type: stack
  parent: BaseMediumStack
  id: WLFrozenBranchStack
  name: stack-wl-frozen-branches
  icon: { sprite: /Textures/_WL/Objects/Misc/materials.rsi, state: scrap_wood }
  spawn: WLFrozenBranch

- type: stack
  parent: BaseMediumStack
  id: WLLooseScrapStack
  name: stack-wl-loose-scrap
  icon: { sprite: /Textures/_WL/Objects/Misc/materials.rsi, state: scrap_steel }
  spawn: WLLooseScrap

- type: stack
  parent: BaseMediumStack
  id: WLRoughStoneStack
  name: stack-wl-rough-stone
  icon: { sprite: /Textures/Objects/Materials/ore.rsi, state: iron }
