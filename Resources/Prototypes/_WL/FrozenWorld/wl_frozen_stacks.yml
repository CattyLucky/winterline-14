# WL-specific stack types for frozen-world resources.
# Keeps balancing isolated from vanilla stack definitions.

- type: stack
  parent: BaseMediumStack
  id: WLWoodFuelStack
  name: stack of frozen firewood
  icon: { sprite: /Textures/Objects/Materials/materials.rsi, state: wood }
  spawn: WLMaterialWoodFuel1

- type: stack
  parent: BaseMediumStack
  id: WLCoalFuelStack
  name: stack of frozen coal
  icon: { sprite: /Textures/Objects/Materials/ore.rsi, state: coal }
  spawn: WLCoalFuel1

- type: stack
  parent: BaseMediumStack
  id: WLFrozenBranchStack
  name: stack of frozen branches
  icon: { sprite: /Textures/Objects/Materials/materials.rsi, state: wood }
  spawn: WLFrozenBranch

- type: stack
  parent: BaseMediumStack
  id: WLLooseScrapStack
  name: stack of loose scrap
  icon: { sprite: /Textures/Objects/Materials/Sheets/metal.rsi, state: steel }
  spawn: WLLooseScrap

- type: stack
  parent: BaseMediumStack
  id: WLTornClothStack
  name: stack of torn cloth
  icon: { sprite: /Textures/Objects/Materials/materials.rsi, state: cloth }
  spawn: WLTornCloth
