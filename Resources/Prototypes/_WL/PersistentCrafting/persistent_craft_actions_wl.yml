- type: entity
  parent: BaseMentalAction
  id: ActionOpenPersistentCraftMenu
  name: persistent craft
  description: Open your personal crafting menu.
  components:
  - type: Action
    itemIconStyle: NoItem
    raiseOnUser: true
    icon:
      sprite: Structures/Machines/autolathe.rsi
      state: icon
  - type: InstantAction
    event: !type:OpenPersistentCraftMenuActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionOpenPersistentCraftPlacementMenu
  name: building plans
  description: Open available building plans.
  components:
  - type: Action
    itemIconStyle: NoItem
    raiseOnUser: true
    icon:
      sprite: Objects/Tools/blueprint.rsi
      state: icon
  - type: InstantAction
    event: !type:OpenPersistentCraftPlacementMenuActionEvent
