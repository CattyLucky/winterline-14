# /// WL Change
# FrozenWorld settlement craft.
#
# Tile recipes create handheld tile stacks.
# Structure recipes create personal persistent-craft blueprints, then the player
# builds those plans with materials. This does not touch vanilla construction.
#
# Material roles:
# - WLFrozenBranchStack: crude wood for first shelter construction.
# - WLLooseScrapStack: metal fittings, frames, and machinery.
# - WLRoughStoneStack: masonry, heavy floors, and outdoor paving.
# - WLStoneBlockStack: shaped masonry blocks for proper walls and doors.
# - WLTornClothStack: clothing, seals, and insulation.

