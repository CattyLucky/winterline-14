# /// WL Change
# FrozenWorld settlement craft.
#
# Tile recipes create handheld tile stacks.
# Structure recipes create personal persistent-craft blueprints, then the player
# builds those plans with materials. This does not touch vanilla construction.

# --- Subcategories -----------------------------------------------------------

- type: persistentCraftSubCategory
  id: WLCraftSubCategoryShelterFloors
  category: WLCraftCategoryGathererProcessor
  name: persistent-craft-wl-subcategory-shelter-floors
  order: 20

- type: persistentCraftSubCategory
  id: WLCraftSubCategoryShelterStructures
  category: WLCraftCategorySettlementHead
  name: persistent-craft-wl-subcategory-shelter-structures
  order: 30

- type: persistentCraftSubCategory
  id: WLCraftSubCategoryShelterGenerators
  category: WLCraftCategorySettlementHead
  name: persistent-craft-wl-subcategory-shelter-generators
  order: 40

