# /// WL Change
# FrozenWorld survival clothing (T1–T5).
# Coats: no ToggleableClothing (hood is a separate craft). Hoods: wl_clothing_frozen_hoods.yml
# Craft: persistent_craft_wl_clothing.yml | Research: WLCraftNodeMechanicClothingT1–T5

# --- Tier 1: Light -----------------------------------------------------------

- type: entity
  parent: ClothingOuterWinterCoat
  id: ClothingOuterWinterCoatLightWL
  suffix: WL, T1, Outer
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
    layers:
    - state: PARA-icon
  - type: Item
    inhandVisuals:
      left:
      - state: PARA-inhand-left
      right:
      - state: PARA-inhand-right
  - type: Clothing
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
    clothingVisuals:
      outerClothing:
      - state: PARA-equipped-OUTERCLOTHING
  - type: FrozenInsulation
    tier: Light
    coverage: [ Torso, Arms, Legs ]

- type: entity
  parent: ClothingUniformJumpsuitLibrarian
  id: ClothingUniformJumpsuitThermalLightWL
  suffix: WL, T1, Inner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WL/Clothing/FrozenWorld/InnerClothing/tier1_light.rsi
    layers:
    - state: icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    sprite: _WL/Clothing/FrozenWorld/InnerClothing/tier1_light.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
  - type: FrozenInsulation
    tier: Light
    coverage: [ Torso, Arms, Legs ]

- type: entity
  parent: ClothingHandsGlovesLeather
  id: ClothingHandsGlovesWinterLightWL
  suffix: WL, T1, Hands
  categories: [ HideSpawnMenu ]
  components:
  - type: FrozenInsulation
    tier: Light
    coverage: [ Hands ]

- type: entity
  parent: ClothingShoesBootsWinter
  id: ClothingShoesBootsWinterLightWL
  suffix: WL, T1, Feet
  categories: [ HideSpawnMenu ]
  components:
  - type: FrozenInsulation
    tier: Light
    coverage: [ Feet ]
  - type: FrozenFootwear
    surfaceColdPenaltyMultiplier: 0.85
    surfaceSpeedPenaltyMultiplier: 0.95

