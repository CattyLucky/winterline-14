# FrozenWorld survival clothing.
# Keep tiers grouped so crafting can later unlock a whole wearable kit at once.

# --- Tier 1: Light -----------------------------------------------------------

- type: entity
  parent: ClothingOuterWinterCoat
  id: ClothingOuterWinterCoatLightWL
  name: light insulated coat
  description: A thin insulated coat for mild frozen weather and short trips outside.
  suffix: WL, T1
  components:
  - type: Sprite
    sprite: _WL/Clothing/FrozenWorld/OuterClothing/tier1_light.rsi
  - type: Clothing
    sprite: _WL/Clothing/FrozenWorld/OuterClothing/tier1_light.rsi
  - type: FrozenInsulation
    tier: Light
    coverage:
    - Torso
    - Arms
    - Legs

- type: entity
  parent: ClothingUniformJumpsuitLibrarian
  id: ClothingUniformJumpsuitThermalLightWL
  name: light thermal jumper
  description: A thin thermal jumper for short trips through light cold.
  suffix: WL, T1
  components:
  - type: FrozenInsulation
    tier: Light
    coverage:
    - Torso
    - Arms
    - Legs

- type: entity
  parent: ClothingHeadHatUshanka
  id: ClothingHeadHatWinterLightWL
  name: light winter hat
  description: A simple insulated hat that keeps the worst wind off your head and face.
  suffix: WL, T1
  components:
  - type: FrozenInsulation
    tier: Light
    coverage:
    - Head
    - Face

- type: entity
  parent: ClothingHandsGlovesLeather
  id: ClothingHandsGlovesWinterLightWL
  name: light winter gloves
  description: Thin insulated gloves for handling tools in mild cold.
  suffix: WL, T1
  components:
  - type: FrozenInsulation
    tier: Light
    coverage:
    - Hands

- type: entity
  parent: ClothingShoesBootsWinter
  id: ClothingShoesBootsWinterLightWL
  name: light winter boots
  description: Light insulated boots for short walks over frozen ground.
  suffix: WL, T1
  components:
  - type: FrozenInsulation
    tier: Light
    coverage:
    - Feet
  - type: FrozenFootwear
    surfaceColdPenaltyMultiplier: 0.85
    surfaceSpeedPenaltyMultiplier: 0.95

