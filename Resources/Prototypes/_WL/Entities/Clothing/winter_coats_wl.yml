# --- Armored Winter Coats ----------------------------------------------------

- type: entity
  parent: ClothingOuterWinterCoatWarmWL
  id: ClothingOuterArmoredWinterCoatWarmWL
  name: warm armored winter coat
  description: A padded winter coat with scrap plates sewn under the lining. It keeps warmth in and glancing blows out.
  suffix: WL, T2, Armored
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.80
        Piercing: 0.90
        Heat: 0.90
  - type: ExplosionResistance
    damageCoefficient: 0.95

- type: entity
  parent: ClothingOuterWinterCoatWL
  id: ClothingOuterArmoredWinterCoatWL
  name: armored winter coat
  description: A heavy winter coat reinforced with fitted plates and thick hide backing for dangerous patrols.
  suffix: WL, T3, Armored
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.80
        Heat: 0.85
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.98

- type: entity
  parent: ClothingOuterWinterCoatArcticWL
