# FrozenWorld outer clothing tiers.
# Each tier has its own RSI path so placeholder art can be replaced independently.

- type: entity
  parent: ClothingOuterWinterCoat
  id: ClothingOuterWinterCoatLightWL
  name: light insulated coat
  description: A thin insulated coat for mild frozen weather and short trips outside.
  suffix: WL, T1
  components:
  - type: Sprite
    sprite: _WL/Clothing/FrozenWorld/OuterClothing/tier1_light.rsi
  - type: Clothing
    sprite: _WL/Clothing/FrozenWorld/OuterClothing/tier1_light.rsi
  - type: FrozenInsulation
    tier: Light
    coverage:
    - Torso
    - Arms
    - Legs

- type: entity
  parent: ClothingOuterWinterCoat
  id: ClothingOuterWinterCoatWarmWL
  name: warm insulated coat
  description: A padded coat for routine work in below-freezing weather.
