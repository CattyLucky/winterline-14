  description: A warm inner layer for survival in severe cold.
  suffix: WL
  components:
  - type: FrozenInsulation
    tier: Warm
    coverage:
    - Torso
    - Arms
    - Legs

- type: entity
  parent: ClothingHeadHelmetBasic
  id: ClothingHeadHelmetWinterWL
  name: winter helmet
  description: An insulated helmet that shields the head and face from freezing air.
  suffix: WL
  components:
  - type: FrozenInsulation
    tier: Winter
    coverage:
    - Head
    - Face

# Backward-compatible alias for previous WL headwear id.
- type: entity
  parent: ClothingHeadHelmetWinterWL
  id: ClothingHeadHatHoodWinterWL
