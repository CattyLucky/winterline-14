# /// WL Change
# Tiered survival hoods — separate head slot items (not coat toggles).
# Craft: persistent_craft_wl_clothing.yml

- type: entity
  abstract: true
  parent: ClothingHeadHatHoodWinterBase
  id: WLClothingHeadHatHoodFrozenBase
  categories: [ HideSpawnMenu ]
  description: A padded hood for FrozenWorld survival. Equip separately from the coat.

- type: entity
