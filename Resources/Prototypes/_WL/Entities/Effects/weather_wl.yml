# /// WL Change
- type: entity
  id: WLWeatherControllerCycle # /// WL Change
  name: wl weather controller
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
    - type: WLWeatherCycle # /// WL Change
      startIndex: 0 # /// WL Change
      applyOnMapInit: true # /// WL Change
      stepDelay: 420 # /// WL Change, seconds for each phase when stepDelays is not set
      # stepDelays: [300, 420, 240] # /// WL Change, optional per-phase seconds for cycle entries below
      cycle: # /// WL Change
        - WeatherSnowfallLight
        - WeatherSnowfallMedium
        - WeatherSnowfallHeavy
